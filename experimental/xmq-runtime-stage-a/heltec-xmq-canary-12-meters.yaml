# BUILD-ONLY 12-meter canary overlay for Heltec SX1262.
# All meter IDs and AES keys are read from local secrets.yaml. No real data
# is committed. The placeholder CI build is NOT authorization to flash.
# The old wmbus_meter still owns state and HA publishing.
packages:
  connectivity: !include heltec-xmq-canary.yaml

# Replace the synthetic meter list entirely, preserving the radio.
# Only T1 is enabled here, as in the previously passing build fixture.
# Enable C1/T1_C1 only after confirming the correct RF revision and firmware.
wmbus_meter:
  - id: heat_baie
    radio_id: wmbus_receiver
    meter_id: !secret heat_baie_id
    key: !secret heat_baie_key
    type: fhkvdataiii
    mode: [T1]
  - id: heat_dormitor_1
    radio_id: wmbus_receiver
    meter_id: !secret heat_dormitor_1_id
    key: !secret heat_dormitor_1_key
    type: fhkvdataiii
    mode: [T1]
  - id: heat_sufragerie
    radio_id: wmbus_receiver
    meter_id: !secret heat_sufragerie_id
    key: !secret heat_sufragerie_key
    type: fhkvdataiii
    mode: [T1]
  - id: heat_bucatarie
    radio_id: wmbus_receiver
    meter_id: !secret heat_bucatarie_id
    key: !secret heat_bucatarie_key
    type: fhkvdataiii
    mode: [T1]
  - id: heat_dormitor_2
    radio_id: wmbus_receiver
    meter_id: !secret heat_dormitor_2_id
    key: !secret heat_dormitor_2_key
    type: fhkvdataiii
    mode: [T1]
  - id: heat_dormitor_3
    radio_id: wmbus_receiver
    meter_id: !secret heat_dormitor_3_id
    key: !secret heat_dormitor_3_key
    type: fhkvdataiii
    mode: [T1]
  - id: heat_wc_serviciu
    radio_id: wmbus_receiver
    meter_id: !secret heat_wc_serviciu_id
    key: !secret heat_wc_serviciu_key
    type: fhkvdataiii
    mode: [T1]
  - id: water_rece_baie
    radio_id: wmbus_receiver
    meter_id: !secret water_rece_baie_id
    key: !secret water_rece_baie_key
    type: mkradio4
    mode: [T1]
  - id: water_rece_bucatarie
    radio_id: wmbus_receiver
    meter_id: !secret water_rece_bucatarie_id
    key: !secret water_rece_bucatarie_key
    type: mkradio4
    mode: [T1]
  - id: water_calda_baie
    radio_id: wmbus_receiver
    meter_id: !secret water_calda_baie_id
    key: !secret water_calda_baie_key
    type: mkradio4
    mode: [T1]
  - id: water_calda_bucatarie
    radio_id: wmbus_receiver
    meter_id: !secret water_calda_bucatarie_id
    key: !secret water_calda_bucatarie_key
    type: mkradio4
    mode: [T1]
  - id: water_calda_wc_serviciu
    radio_id: wmbus_receiver
    meter_id: !secret water_calda_wc_serviciu_id
    key: !secret water_calda_wc_serviciu_key
    type: mkradio4
    mode: [T1]

# This list deliberately replaces the synthetic lab sensors as well.
