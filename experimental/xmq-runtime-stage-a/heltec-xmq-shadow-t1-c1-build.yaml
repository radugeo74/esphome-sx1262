# SYNTHETIC OFFLINE T1_C1 XMQ SHADOW COMPILATION ONLY. NEVER FLASH.
# Standalone: ESPHome package-merges wmbus_meter lists rather than replacing them.
# Derived from heltec-xmq-shadow-build.yaml, with exact drift checked in CI.
# Experimental BUILD ONLY: one Heltec ESPHome firmware links old radio and XMQ.
# Includes no secret keys or network; do not flash; probe default disabled.
# Build-only integration fixture. Never flash without RF validation.
# One physical SX1262, exclusively owned by patched components/sx126x.
# Legacy wmbus_radio SPI/IRQ transceiver is NOT instantiated.
esphome:
  name: sx126x-xmq-shadow-t1c1-lab
  friendly_name: SX126x XMQ Shadow Build Lab

esp32:
  board: heltec_wifi_lora_32_V3
  flash_size: 8MB
  framework:
    type: esp-idf

logger:
  level: DEBUG

external_components:
  - source:
      type: local
      path: ../../components
    components: [sx126x, wmbus_common, wmbus_radio]
  - source:
      type: local
      path: ./components
    components: [wmbus_meter, xmq_shadow_probe]

xmq_shadow_probe:
  id: xmq_lab_probe
  enabled: true  # only for synthetic offline CI, NEVER FLASH

spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10
  miso_pin: GPIO11

sx126x:
  id: native_radio
  hw_version: sx1262
  modulation: FSK
  frequency: 868950000
  bitrate: 100000
  deviation: 50000
  bandwidth: 234_3kHz
  shaping: NONE
  crc_enable: false
  whitening_enable: false
  sync_value: [0x54, 0x3D]
  preamble_size: 2
  preamble_detect: 2
  payload_length: 255
  rx_start: true
  rf_switch: true
  tcxo_voltage: 3_0V
  tcxo_delay: 5ms
  busy_pin: GPIO13
  dio1_pin: GPIO14
  rst_pin: GPIO12
  cs_pin: GPIO8

# Include the optional C1 water-meter driver without configuring a real meter.
# The fixture uses synthetic meter IDs and remains build-only.
wmbus_common:
  drivers:
    - fhkvdataiii
    - mkradio4
    - mkradio4a

wmbus_radio:
  id: wmbus_receiver
  sx126x_id: native_radio
  # Default stays T1 for build-only safety; real Heltec T1+C1/A RF
  # validation is documented separately. Enable T1_C1 only for RF tests.
  native_stream_mode: T1_C1

wmbus_meter:
  - id: lab_water
    radio_id: wmbus_receiver
    meter_id: 0x12345678  # synthetic, NOT a private meter
    type: mkradio4
    mode: [T1, C1]
  # Additional build-only callback coverage for the AES-CBC-IV water driver.
  # This has NO real meter key, data, or HA sensor; the XMQ observer may
  # count CI/TPL metadata but MUST NOT publish or claim field parity.
  - id: lab_water_mkradio4a_census
    radio_id: wmbus_receiver
    meter_id: 0x12345679  # synthetic CI-only value
    type: mkradio4a
    mode: [T1, C1]

sensor:
  - platform: wmbus_meter
    parent_id: lab_water
    name: "Lab Water Volume"
    field: total_m3
    unit_of_measurement: "m³"
    accuracy_decimals: 1
  - platform: wmbus_meter
    parent_id: lab_water
    name: "Lab Water RSSI"
    field: rssi_dbm
    unit_of_measurement: "dBm"
    accuracy_decimals: 0
