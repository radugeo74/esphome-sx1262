# BUILD-ONLY: synthetic IDs and no Wi-Fi/API/OTA. Do not flash.
# End-to-end SX1262 T1/C1 CRC -> direct XMQ -> HA sensor entities.
esphome:
  name: heltec-xmq-standalone-lab
esp32:
  board: heltec_wifi_lora_32_V3
  flash_size: 8MB
  framework:
    type: esp-idf
logger:
  level: INFO
# CI-only network credentials. This fixture must NEVER be flashed.
wifi:
  ssid: "XMQ-CI-ONLY"
  password: "synthetic-build-only"
api:
  encryption:
    key: "AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE="
ota:
  - platform: esphome
    password: "synthetic-ota-build-only"
external_components:
  - source:
      type: local
      path: ../../components
    components: [sx126x, wmbus_common, wmbus_radio]
  - source:
      type: local
      path: ./components
    components: [xmq_meter]
spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10
  miso_pin: GPIO11
sx126x:
  id: native_radio
  hw_version: sx1262
  modulation: FSK
  frequency: 868950000
  bitrate: 100000
  deviation: 50000
  bandwidth: 234_3kHz
  shaping: NONE
  crc_enable: false
  whitening_enable: false
  sync_value: [0x54, 0x3D]
  preamble_size: 2
  preamble_detect: 2
  payload_length: 255
  rx_start: true
  rf_switch: true
  tcxo_voltage: 3_0V
  tcxo_delay: 5ms
  busy_pin: GPIO13
  dio1_pin: GPIO14
  rst_pin: GPIO12
  cs_pin: GPIO8
wmbus_common:
  radio_only: true

wmbus_radio:
  id: receiver
  sx126x_id: native_radio
  native_stream_mode: T1_C1
  direct_xmq_only: true
xmq_meter:
  - id: xmq_heat_1
    radio_id: receiver
    meter_id: 0x12345000
    family: heat
    current_hca:
      name: "CI XMQ Heat 1 current_hca"
    previous_hca:
      name: "CI XMQ Heat 1 previous_hca"
    temp_room_c:
      name: "CI XMQ Heat 1 temp_room_c"
