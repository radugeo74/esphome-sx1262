# CI-only syntax/build fixture. Pins are arbitrary devkit values, NOT Heltec wiring.
# Public synthetic test identifiers and NIST/public fixture AES keys only.
# Build-only, never flash or commit real meter keys.
esphome:
  name: native-sx126x-batch2-ci
  friendly_name: Native SX126x Batch2 CI

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG

spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10
  miso_pin: GPIO11

external_components:
  - source:
      type: local
      path: ../../../components
    components: [sx126x, wmbus_native_sx126x]

sx126x:
  id: native_sx1262
  hw_version: sx1262
  modulation: FSK
  frequency: 868950000
  bitrate: 100000
  deviation: 50000
  bandwidth: 234_3kHz
  shaping: NONE
  crc_enable: false
  whitening_enable: false
  sync_value: [0x54, 0x3D]
  preamble_size: 2
  preamble_detect: 2
  payload_length: 255
  rx_start: true
  rf_switch: false
  busy_pin: GPIO13
  dio1_pin: GPIO14
  rst_pin: GPIO12
  cs_pin: GPIO8

wmbus_native_sx126x:
  sx126x_id: native_sx1262
  c1_format: A
  link_mode: T1_C1
  t1_raw_diagnostics: true
  configured_meter_ids: []
  # Deliberate opt-in for the three still-experimental encrypted decoders.
  # These IDs are synthetic and do not correspond to installed meters.
  secure_meters:
    - meter_id: "12340001"
      dll_meter_id: "55036410" # synthetic radio gateway ID, intentionally not the TPL meter
      driver: minomess
      key: "000102030405060708090A0B0C0D0E0F"
    - meter_id: "12340002"
      driver: kamwater
      key: "000102030405060708090A0B0C0D0E0F"
    - meter_id: "12340003"
      driver: apator162
      key: "00000000000000000000000000000000"
    - meter_id: "12340004"
      dll_meter_id: "55036414"  # synthetic TCH radio converter
      driver: mkradio4a
      key: "000102030405060708090A0B0C0D0E0F"
  xmq_text_sensors:
    - meter_id: "12340004"
      field: target_date
      sensor:
        name: "CI MK Radio4a Target Date"
    - meter_id: "12340002"
      field: status
      sensor:
        name: "CI Kamwater Authenticated Status"
  xmq_sensors:
    - meter_id: "12340001"
      field: total_m3
      sensor:
        name: "CI Minomess Total"
    - meter_id: "12340002"
      field: target_m3
      sensor:
        name: "CI Kamwater Target"
    - meter_id: "12340003"
      field: total_m3
      sensor:
        name: "CI Apator Total"
    - meter_id: "12340004"
      field: target_m3
      sensor:
        name: "CI MK Radio4a Target Volume"
