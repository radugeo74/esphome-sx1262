# CI-only syntax/build fixture. Pins are arbitrary devkit values, NOT Heltec wiring.
# No network credentials, meter keys, sensors or production IDs.
esphome:
  name: native-sx126x-ci
  friendly_name: Native SX126x CI

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG

spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10
  miso_pin: GPIO11

external_components:
  - source:
      type: local
      path: ../../../components
    components: [wmbus_native_sx126x]

sx126x:
  id: native_sx1262
  hw_version: sx1262
  modulation: FSK
  frequency: 868950000
  bitrate: 100000
  deviation: 50000
  bandwidth: 234_3kHz
  shaping: NONE
  crc_enable: false
  whitening_enable: false
  sync_value: [0x54, 0x3D]
  preamble_size: 2
  preamble_detect: 2
  payload_length: 0
  rx_start: true
  rf_switch: false
  busy_pin: GPIO13
  dio1_pin: GPIO14
  rst_pin: GPIO12
  cs_pin: GPIO8

wmbus_native_sx126x:
  sx126x_id: native_sx1262
  c1_format: B
  link_mode: C1
  configured_meter_ids: []
