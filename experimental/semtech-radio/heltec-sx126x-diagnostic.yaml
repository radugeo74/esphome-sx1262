# Heltec Wireless Stick Lite V3 SX1262: isolated USB/serial diagnostic only.
# Does not publish sensors. Confirm board revision and keep current firmware backup.
# This YAML must be compiled from the repository root with ESPHome 2026.10.1.
esphome:
  name: heltec-sx126x-diagnostic
  friendly_name: Heltec SX126x Diagnostic

esp32:
  board: heltec_wifi_lora_32_V3
  flash_size: 8MB
  framework:
    type: esp-idf
    advanced:
      loop_task_stack_size: 12288

logger:
  level: DEBUG

spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10
  miso_pin: GPIO11

external_components:
  - source:
      type: local
      path: ../../components
    components: [sx126x, wmbus_native_sx126x]

sx126x:
  id: native_sx1262
  hw_version: sx1262
  modulation: FSK
  frequency: 868950000
  bitrate: 100000
  deviation: 50000
  bandwidth: 234_3kHz
  shaping: NONE
  crc_enable: false
  whitening_enable: false
  sync_value: [0x54, 0x3D]
  preamble_size: 2
  preamble_detect: 2
  payload_length: 0
  rx_start: true
  # RF switch/TCXO are assumptions for the board family, not taken from
  # the previous custom driver's YAML. Verify them on hardware before flashing.
  rf_switch: true
  tcxo_voltage: 1_8V
  tcxo_delay: 5ms
  busy_pin: GPIO13
  dio1_pin: GPIO14
  rst_pin: GPIO12
  cs_pin: GPIO8

wmbus_native_sx126x:
  sx126x_id: native_sx1262
  c1_format: B
  link_mode: C1
  # Keep real meter identifiers in a local, untracked configuration only.
  configured_meter_ids: []
