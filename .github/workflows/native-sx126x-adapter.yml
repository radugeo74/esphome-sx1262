name: Native SX126x adapter (experimental)

on:
  push:
    branches:
      - experimental/semtech-sx126x-sx127x
      - experimental/semtech-sx126x-t1-c1-combined
      - experimental/xmq-multidriver-auto
    paths:
      - 'components/wmbus_native_sx126x/**'
      - 'experimental/xmq/drivers/**'
      - 'experimental/xmq/tools/generate_driver_registry.py'
      - 'components/sx126x/**'
      - 'experimental/semtech-radio/**'
      - 'experimental/xmq/tests/test_pure_crc.cpp'
      - '.github/workflows/native-sx126x-adapter.yml'
  workflow_dispatch:

jobs:
  native-packet-input:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Repository-wide privacy audit (all branch HEADs)
        run: python3 experimental/semtech-radio/ci/privacy_audit.py
      - name: Build input contract test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            experimental/semtech-radio/test_native_packet_input.cpp \
            -o /tmp/test-native-packet-input
      - name: Run input contract test
        run: /tmp/test-native-packet-input
      - name: Build and test C1 post-sync framing
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            experimental/semtech-radio/test_native_c1_framing.cpp \
            -o /tmp/test-native-c1-framing
          /tmp/test-native-c1-framing
      - name: Build and test C1 CRC diagnostics
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            experimental/semtech-radio/test_native_c1_integrity.cpp \
            -o /tmp/test-native-c1-integrity
          /tmp/test-native-c1-integrity
      - name: Build and test C1 block CRC failure locator
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. -Icomponents/wmbus_radio \
            experimental/semtech-radio/test_c1_block_diagnostics.cpp \
            -o /tmp/test-c1-block-diagnostics
          /tmp/test-c1-block-diagnostics
      - name: Generate and test native XMQ auto registry (metadata only)
        run: |
          python3 experimental/xmq/tools/generate_driver_registry.py \
            experimental/xmq/drivers/*.xmq \
            --out components/wmbus_native_sx126x/xmq_auto_registry.h
          cp components/wmbus_radio/pure_driver_registry.h components/wmbus_native_sx126x/pure_driver_registry.h
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            experimental/semtech-radio/test_xmq_auto_registry.cpp \
            -o /tmp/test-xmq-auto-registry
          /tmp/test-xmq-auto-registry
      - name: Test standard DIF VIF parity with original dvparser
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            -Icomponents/wmbus_native_sx126x -Iexperimental/xmq/portable_cpp \
            experimental/semtech-radio/test_standard_dif_vif_parity.cpp \
            -o /tmp/test-standard-dif-vif
          /tmp/test-standard-dif-vif
      - name: Test official Hydrus cleartext records (no decryption)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. -Icomponents/wmbus_native_sx126x -Iexperimental/xmq/portable_cpp \
            experimental/semtech-radio/test_hydrus_plain.cpp \
            -o /tmp/test-hydrus-plain
          /tmp/test-hydrus-plain
      - name: Test official Sensus iPERL plaintext NOKEY fixtures
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. -Icomponents/wmbus_native_sx126x -Iexperimental/xmq/portable_cpp \
            experimental/semtech-radio/test_iperl_plain.cpp \
            -o /tmp/test-iperl-plain
          /tmp/test-iperl-plain
      - name: Test official mkradio4a NOKEY examples (portable XMQ)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. -Icomponents/wmbus_native_sx126x -Iexperimental/xmq/portable_cpp \
            experimental/semtech-radio/test_mkradio4a_plain.cpp \
            -o /tmp/test-mkradio4a-plain
          /tmp/test-mkradio4a-plain
      - name: Test synthetic complete C1 A and long C1 B CRC pipeline
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            experimental/semtech-radio/test_combined_c1_crc_end_to_end.cpp \
            -o /tmp/test-combined-c1-crc
          /tmp/test-combined-c1-crc
      - name: Build and test T1 3-of-6 decoder
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            experimental/semtech-radio/test_native_t1_3of6.cpp \
            -o /tmp/test-native-t1
          /tmp/test-native-t1
      - name: Build and test common T1/C1 frame boundary
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            experimental/semtech-radio/test_native_frame_boundary.cpp \
            -o /tmp/test-native-frame-boundary
          /tmp/test-native-frame-boundary
      - name: Test native C1 boundary against existing pure DLL verifier
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            experimental/semtech-radio/test_native_to_pure_validation.cpp \
            -o /tmp/test-native-pure-validation
          /tmp/test-native-pure-validation
      - name: Test T1 symbols through pure DLL CRC verifier
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            experimental/semtech-radio/test_native_t1_to_pure_validation.cpp \
            -o /tmp/test-native-t1-pure
          /tmp/test-native-t1-pure
      - name: Assert native fixture has no legacy radio owner
        run: python3 experimental/semtech-radio/ci/check_native_only.py
      - name: Test variable-length T1 packet framing
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            experimental/semtech-radio/test_native_t1_packet_framing.cpp \
            -o /tmp/test-native-t1-packet-framing
          /tmp/test-native-t1-packet-framing
      - name: Test native verified DLL bridge
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            experimental/semtech-radio/test_native_verified_bridge.cpp \
            -o /tmp/test-native-verified-bridge
          /tmp/test-native-verified-bridge
      - name: Test native verified meter registry
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            experimental/semtech-radio/test_native_meter_registry.cpp \
            -o /tmp/test-native-meter-registry
          /tmp/test-native-meter-registry
      - name: Test progressive T1 FIFO collector
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            experimental/semtech-radio/test_native_t1_progressive_buffer.cpp \
            -o /tmp/test-native-t1-progressive
          /tmp/test-native-t1-progressive
      - name: Test progressive T1 verified bridge
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            experimental/semtech-radio/test_native_t1_progressive_verified.cpp \
            -o /tmp/test-native-t1-progressive-verified
          /tmp/test-native-t1-progressive-verified
      - name: Test non-owning T1 FIFO integration contract
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            experimental/semtech-radio/test_native_t1_fifo_contract.cpp \
            -o /tmp/test-native-t1-fifo-contract
          /tmp/test-native-t1-fifo-contract
      - name: Test conservative TPL encryption classification
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            experimental/semtech-radio/tests/test_tpl_security_probe.cpp \
            -o /tmp/test-tpl-security
          /tmp/test-tpl-security
      - name: Compile and run official XMQ heat and water fixture regression
        run: |
          python3 experimental/xmq/tools/generate_ixml_cpp.py \
            experimental/xmq/drivers/mkradio4.xmq \
            experimental/xmq/drivers/fhkvdataiii.xmq \
            --out components/wmbus_meter/xmq_generated.h
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            experimental/xmq/tests/test_official_driver_fixtures.cpp \
            -o /tmp/test-official-xmq-fixtures
          /tmp/test-official-xmq-fixtures

      - name: Test typed text fields on official iPERL and Hydrus cleartext fixtures
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            -Icomponents/wmbus_native_sx126x -Iexperimental/xmq/portable_cpp \
            experimental/semtech-radio/test_xmq_plain_text_fields.cpp \
            -o /tmp/test-xmq-text-fields
          /tmp/test-xmq-text-fields
      - name: Test configured plaintext XMQ dispatch against official fixtures
        run: |
          python3 experimental/xmq/tools/generate_ixml_cpp.py \
            experimental/xmq/drivers/mkradio4.xmq \
            experimental/xmq/drivers/fhkvdataiii.xmq \
            --out components/wmbus_native_sx126x/xmq_generated.h
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            -Icomponents/wmbus_native_sx126x -Iexperimental/xmq/portable_cpp \
            experimental/semtech-radio/test_configured_plain_decode.cpp \
            -o /tmp/test-configured-plain-decode
          /tmp/test-configured-plain-decode

      - name: Check ESPHome probe Python syntax
        run: python3 -m py_compile components/wmbus_native_sx126x/__init__.py

  native-esphome-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned ESPHome
        run: python -m pip install 'esphome==2026.10.1'
      - name: Guard official SX126x 2026.10.1 RX hook
        run: |
          SX126X_CPP=$(python -c 'from pathlib import Path; import esphome; print(Path(esphome.__file__).parent / "components/sx126x/sx126x.cpp")')
          python3 experimental/semtech-radio/ci/check_sx126x_rx_hook.py "$SX126X_CPP"
      - name: Check T1 patcher Python syntax
        run: python3 -m py_compile experimental/semtech-radio/ci/patch_sx126x_t1_stream.py
      - name: Assert GitHub-supplied official SX126x includes T1 hook
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h = Path('components/sx126x/sx126x.h').read_text()
          cpp = Path('components/sx126x/sx126x.cpp').read_text()
          assert 'SX126X_EXPERIMENTAL_T1_STREAM' in h
          assert 't1_stream_loop_()' in cpp
          assert 'IRQ_SYNCWORD_VALID' in cpp
          PY
      - name: Compile official SX126x T1 stream on Heltec (not flashed)
        run: esphome compile experimental/semtech-radio/heltec-sx126x-t1-lab.yaml
      - name: Validate native receiver fixture
        run: esphome config experimental/semtech-radio/ci/native-sx126x-esphome.yaml
      - name: Validate real-pin Heltec diagnostic YAML
        run: esphome config experimental/semtech-radio/heltec-sx126x-diagnostic.yaml
      - name: Validate build-only Heltec T1 lab configuration
        run: esphome config experimental/semtech-radio/heltec-sx126x-t1-lab.yaml
      - name: Compile Heltec SX126x diagnostic firmware
        run: esphome compile experimental/semtech-radio/heltec-sx126x-diagnostic.yaml
      - name: Compile native SX126x receiver
        run: esphome compile experimental/semtech-radio/ci/native-sx126x-esphome.yaml
      - name: Validate combined T1/C1 Heltec laboratory YAML
        run: esphome config experimental/semtech-radio/heltec-sx126x-combined-lab.yaml
      - name: Compile combined T1/C1 Heltec firmware (not flashed)
        run: esphome compile experimental/semtech-radio/heltec-sx126x-combined-lab.yaml
