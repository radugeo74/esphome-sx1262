      - name: Test upstream XMQ C-style comment tokenization
        run: python3 experimental/xmq/tests/test_portable_xmq_block_comments.py
      - name: Audit second driver batch official XMQ fixture inventory and fail-closed publication
        run: python3 experimental/xmq/tests/test_batch2_upstream_fixtures.py
      - name: Stage B upstream golden fixture parity ledger (NOT_RUN until actual JSON comparison)
        run: python3 experimental/xmq/tests/test_batch2_parity_ledger.py
      - name: Stage A shared portable parser and pending runtime admission guard
        run: |
          python3 experimental/xmq/tests/test_stage_a_shared_portable_boundary.py
      - name: Stage B exact original JSON functional-field gap audit (no full parity promotion)
        run: |
          python3 experimental/xmq/tests/test_batch2_field_gap_audit.py
          python3 experimental/xmq/tests/test_batch2_field_gap_audit.py --json > /tmp/batch2-field-gap-audit.json
          python3 -m json.tool /tmp/batch2-field-gap-audit.json > /dev/null
      - name: Stage B compare native C++ clear application outputs with 7 upstream XMQ fixtures
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            -Icomponents/wmbus_native_sx126x -Icomponents/wmbus_radio \
            -Iexperimental/xmq/portable_cpp \
            experimental/semtech-radio/test_batch2_clear_fixture_cli.cpp \
            -o /tmp/test-batch2-clear-fixture-cli
          python3 experimental/xmq/tests/test_batch2_clear_fixture_parity.py \
            /tmp/test-batch2-clear-fixture-cli
          python3 experimental/xmq/tests/test_apator162_upstream_volume_parity.py \
            /tmp/test-batch2-clear-fixture-cli
          python3 experimental/xmq/tests/test_kamwater_compact_upstream_parity.py \
            /tmp/test-batch2-clear-fixture-cli
          python3 experimental/xmq/tests/test_kamwater_status_upstream_parity.py \
            /tmp/test-batch2-clear-fixture-cli
          python3 experimental/xmq/tests/test_kamwater_numeric_upstream_parity.py \
            /tmp/test-batch2-clear-fixture-cli
          python3 experimental/xmq/tests/test_kamwater_tpl_status_upstream_parity.py \
            /tmp/test-batch2-clear-fixture-cli
          python3 experimental/xmq/tests/test_minomess_wired_upstream_parity.py \
            /tmp/test-batch2-clear-fixture-cli
      - name: Test standard DIF VIF parity with original dvparser
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
