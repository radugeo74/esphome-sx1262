  stage-a-espidf-s3-portable-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Generate the unchanged live Techem XMQ driver tables
        run: |
          python3 experimental/xmq/tools/generate_ixml_cpp.py \
            experimental/xmq/drivers/mkradio4.xmq \
            experimental/xmq/drivers/fhkvdataiii.xmq \
            --out experimental/xmq/generated/generated_ixml.h
      - name: Build shared Apator162 and live XMQ runtime with real ESP-IDF ESP32-S3 toolchain
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32s3
          path: experimental/xmq/espidf_cpp_probe
          command: |
            idf.py build
            idf.py size

  native-esphome-build:
    runs-on: ubuntu-24.04
    env:
      # ESPHome 2026.10.1 understands semicolon-separated framework mirrors.
      # The first URL preserves the pinned ESPHome archive. Official Espressif
      # release ZIP provides a fallback if GitHub release downloads return 504.
      # Archive extraction checks file magic, not the temporary .tar.xz name.
      ESPHOME_IDF_FRAMEWORK_MIRRORS: "https://github.com/esphome-libs/esp-idf/releases/download/v{VERSION}/esp-idf-v{VERSION}.tar.xz;https://dl.espressif.com/github_assets/espressif/esp-idf/releases/download/v{VERSION}/esp-idf-v{VERSION}.zip"
      # Official Espressif alternative for xtensa/riscv/ROM toolchain assets.
      IDF_GITHUB_ASSETS: dl.espressif.com/github_assets
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned ESPHome
        run: python -m pip install 'esphome==2026.10.1'
      - name: Restore cache for pinned ESPHome IDF framework and tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/esphome/idf
          key: ${{ runner.os }}-${{ runner.arch }}-esphome-2026.10.1-idf-5.5.6-py312-v1
      - name: Guard official SX126x 2026.10.1 RX hook
        run: |
          SX126X_CPP=$(python -c 'from pathlib import Path; import esphome; print(Path(esphome.__file__).parent / "components/sx126x/sx126x.cpp")')
          python3 experimental/semtech-radio/ci/check_sx126x_rx_hook.py "$SX126X_CPP"
      - name: Check T1 patcher Python syntax
        run: python3 -m py_compile experimental/semtech-radio/ci/patch_sx126x_t1_stream.py
      - name: Assert GitHub-supplied official SX126x includes T1 hook
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h = Path('components/sx126x/sx126x.h').read_text()
          cpp = Path('components/sx126x/sx126x.cpp').read_text()
          assert 'SX126X_EXPERIMENTAL_T1_STREAM' in h
          assert 't1_stream_loop_()' in cpp
          assert 'IRQ_SYNCWORD_VALID' in cpp
          PY
      - name: Compile official SX126x T1 stream on Heltec (not flashed)
        run: esphome compile experimental/semtech-radio/heltec-sx126x-t1-lab.yaml
      - name: Validate native receiver fixture
        run: esphome config experimental/semtech-radio/ci/native-sx126x-esphome.yaml
      - name: Validate real-pin Heltec diagnostic YAML
        run: esphome config experimental/semtech-radio/heltec-sx126x-diagnostic.yaml
      - name: Validate build-only Heltec T1 lab configuration
        run: esphome config experimental/semtech-radio/heltec-sx126x-t1-lab.yaml
      - name: Compile Heltec SX126x diagnostic firmware
        run: esphome compile experimental/semtech-radio/heltec-sx126x-diagnostic.yaml
      - name: Compile native SX126x receiver
        run: esphome compile experimental/semtech-radio/ci/native-sx126x-esphome.yaml
      - name: Validate build-only native encrypted Minomess Kamwater Apator162 bindings
        run: esphome config experimental/semtech-radio/ci/native-sx126x-batch2-lab.yaml
      - name: Compile opt-in encrypted native SX1262 receiver on ESP32-S3 (DO NOT FLASH)
        run: esphome compile experimental/semtech-radio/ci/native-sx126x-batch2-lab.yaml
      - name: Validate explicit NO-KEY Minomess Kamwater Apator162 on SX1262
        run: esphome config experimental/semtech-radio/ci/native-sx126x-batch2-nokey-lab.yaml
      - name: Compile three native XMQ no-key drivers without mbedTLS CCM or any AES key (DO NOT FLASH)
        run: esphome compile experimental/semtech-radio/ci/native-sx126x-batch2-nokey-lab.yaml
      - name: Validate combined T1/C1 Heltec laboratory YAML
        run: esphome config experimental/semtech-radio/heltec-sx126x-combined-lab.yaml
      - name: Compile combined T1/C1 Heltec firmware (not flashed)
        run: esphome compile experimental/semtech-radio/heltec-sx126x-combined-lab.yaml
