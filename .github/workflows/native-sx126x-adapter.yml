name: Native SX126x adapter (experimental)

on:
  push:
    branches:
      - experimental/semtech-sx126x-sx127x
      - experimental/semtech-sx126x-t1-c1-combined
      - experimental/xmq-multidriver-auto
    paths:
      - 'components/wmbus_native_sx126x/**'
      - 'experimental/xmq/drivers/**'
      - 'experimental/xmq/security_profile_catalog.json'
      - 'experimental/xmq/SECURITY_PROFILE_CATALOG.md'
      - 'experimental/xmq/tools/generate_driver_registry.py'
      - 'experimental/xmq/tools/**'
      - 'experimental/xmq/tests/**'
      - 'experimental/xmq/espidf_cpp_probe/**'
      - 'components/sx126x/**'
      - 'experimental/semtech-radio/**'
      - 'experimental/xmq/tests/test_pure_crc.cpp'
      - '.github/workflows/native-sx126x-adapter.yml'
  workflow_dispatch:

jobs:
  native-packet-input:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Repository-wide privacy audit (all branch HEADs)
        run: python3 experimental/semtech-radio/ci/privacy_audit.py
      - name: Require Heltec lab YAML to compile same checked-out SX126x and RSSI code
        run: python3 experimental/semtech-radio/ci/test_heltec_lab_source_ref.py
      - name: Check ESPHome 5.5.6 mirror and cache pins
        run: python3 experimental/semtech-radio/ci/test_idf_mirror_ci_contract.py
      - name: Build input contract test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            experimental/semtech-radio/test_native_packet_input.cpp \
            -o /tmp/test-native-packet-input
      - name: Run input contract test
        run: /tmp/test-native-packet-input
      - name: Test runtime secure_meters registration for all five AES drivers
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            experimental/semtech-radio/test_secure_meter_binding.cpp \
            -o /tmp/test-secure-meter-binding
          /tmp/test-secure-meter-binding
      - name: Build and test C1 post-sync framing
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            experimental/semtech-radio/test_native_c1_framing.cpp \
            -o /tmp/test-native-c1-framing
          /tmp/test-native-c1-framing
      - name: Build and test C1 CRC diagnostics
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            experimental/semtech-radio/test_native_c1_integrity.cpp \
            -o /tmp/test-native-c1-integrity
          /tmp/test-native-c1-integrity
      - name: Build and test C1 block CRC failure locator
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. -Icomponents/wmbus_radio \
            experimental/semtech-radio/test_c1_block_diagnostics.cpp \
            -o /tmp/test-c1-block-diagnostics
          /tmp/test-c1-block-diagnostics
      - name: Generate and test native XMQ auto registry (metadata only)
        run: |
          python3 experimental/xmq/tools/build_native_generated.py
          python3 experimental/xmq/tools/generate_driver_registry.py \
            experimental/xmq/drivers/*.xmq \
            --out components/wmbus_native_sx126x/xmq_auto_registry.h
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            experimental/semtech-radio/test_xmq_auto_registry.cpp \
            -o /tmp/test-xmq-auto-registry
          /tmp/test-xmq-auto-registry
      - name: Test Lansen TH and SM supplied-clear application parsers (host-only, NOT RF)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            experimental/semtech-radio/test_lansen_th_sm_supplied_clear.cpp \
            -o /tmp/test-lansen-th-sm-supplied-clear
          /tmp/test-lansen-th-sm-supplied-clear
      - name: Test explicit-key native Lansen TH and SM Mode-5 AES (synthetic ciphertext)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libmbedtls-dev
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            -Icomponents/wmbus_native_sx126x -Iexperimental/xmq/portable_cpp \
            experimental/semtech-radio/test_lansen_th_sm_native_mode5.cpp \
            -o /tmp/test-lansen-th-sm-native-aes -lmbedcrypto
          /tmp/test-lansen-th-sm-native-aes
      - name: Test configured native Elvaco Sense and Lansen R4 clear profiles
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            -Icomponents/wmbus_native_sx126x -Iexperimental/xmq/portable_cpp \
            experimental/semtech-radio/test_elvsense_lansenrp_native.cpp \
            -o /tmp/test-elvsense-lansenrp-native
          /tmp/test-elvsense-lansenrp-native
      - name: Test QSmoke and QCaloric native clear-only fixture admission
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            -Icomponents/wmbus_native_sx126x -Iexperimental/xmq/portable_cpp \
            experimental/semtech-radio/test_qsmoke_qcaloric_native.cpp \
            -o /tmp/test-qsmoke-qcaloric
          /tmp/test-qsmoke-qcaloric
      - name: Test RFM-AMB and Sensostar clear-only native profiles
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            -Icomponents/wmbus_native_sx126x -Iexperimental/xmq/portable_cpp \
            experimental/semtech-radio/test_rfmamb_sensostar_native.cpp \
            -o /tmp/test-rfmamb-sensostar
          /tmp/test-rfmamb-sensostar
      - name: Test EVO868 and Supercom 587 configured clear-TPL original fixtures
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            -Icomponents/wmbus_native_sx126x -Iexperimental/xmq/portable_cpp \
            experimental/semtech-radio/test_evo868_supercom587_native.cpp \
            -o /tmp/test-evo868-supercom587
          /tmp/test-evo868-supercom587
      - name: Test HCA E2 and BFW240 native Mode-0 subset with original fixtures
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            -Icomponents/wmbus_native_sx126x -Iexperimental/xmq/portable_cpp \
            experimental/semtech-radio/test_hcae2_bfw240radio_native.cpp \
            -o /tmp/test-hcae2-bfw240
          /tmp/test-hcae2-bfw240
      - name: Test QWater V2 and Hydrodigit native strict Mode-0 original fixtures
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            -Icomponents/wmbus_native_sx126x -Iexperimental/xmq/portable_cpp \
            experimental/semtech-radio/test_qwaterv2_hydrodigit_native.cpp \
            -o /tmp/test-qwaterv2-hydrodigit
          /tmp/test-qwaterv2-hydrodigit
      - name: Test Itron and Qualcosonic native Mode-0 original fixtures
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. \
            -Icomponents/wmbus_native_sx126x -Iexperimental/xmq/portable_cpp \
            experimental/semtech-radio/test_itron_qualcosonic_native.cpp \
            -o /tmp/test-itron-qualcosonic
          /tmp/test-itron-qualcosonic
      - name: Test native XMQ manifest and generated decoder parity
        run: python3 experimental/xmq/tests/test_native_driver_manifest.py
      - name: Audit OMS security evidence catalog for all 32 drivers
        run: python3 experimental/xmq/tests/test_security_profile_catalog.py
      - name: Check NOKEY provenance and 44 encrypted-header counterexamples from all XMQ fixtures
        run: python3 experimental/xmq/tests/test_nokey_fixture_provenance.py
