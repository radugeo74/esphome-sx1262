name: XMQ Stage A isolated host tests
on:
  push:
    branches:
      - experimental/xmq-runtime-stage-a
    paths:
      - experimental/xmq-runtime-stage-a/run-once-20261116.txt
permissions:
  contents: read
concurrency:
  group: xmq-stage-a-single-validation
  cancel-in-progress: false
jobs:
  xmq-stage-a-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify GitHub-bundled XMQ shadow API matches core source BEFORE staging
        shell: bash
        run: |
          set -euo pipefail
          dir=experimental/xmq-runtime-stage-a
          cmp "$dir/xmq_shadow_diagnostic.h" "$dir/components/xmq_shadow_probe/xmq_shadow_diagnostic.h"
          echo "PASS: GitHub-installable shadow API matches host source"
      - name: Compile and run isolated XMQ tests
        shell: bash
        run: |
          set -euo pipefail
          dir=experimental/xmq-runtime-stage-a
          python "$dir/tools/stage_shadow_headers.py"
          failures=0
          for suite in reader semantic expression dv_subset projection ixml_subset numeric_runtime hca_numeric calendar oms_partial clear_runtime driver_registry driver_loader source_registry mounted_vfs frame_bridge shadow_compare shadow_diagnostic legacy_write_journal legacy_write_report legacy_write_observer telegram_capture real_telegram_contract compat_macros staged_reader; do
            echo "::group::XMQ suite: $suite"
            if g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic \
              -fsanitize=address,undefined -fno-omit-frame-pointer \
              -I"$dir" -I"$dir/host-stubs" "$dir/test_xmq_${suite}.cpp" \
              -o "$RUNNER_TEMP/xmq-${suite}"; then
              if "$RUNNER_TEMP/xmq-${suite}"; then
                echo "PASS $suite"
              else
                echo "::error title=XMQ test failure::$suite failed"
                failures=$((failures+1))
              fi
            else
              echo "::error title=XMQ compile failure::$suite failed compilation"
              failures=$((failures+1))
            fi
            echo "::endgroup::"
          done
          echo "XMQ suite failures: $failures"
          exit "$((failures>0))"
      - name: Check confidential local canary preflight regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
          python experimental/xmq-runtime-stage-a/tools/test_preflight_canary.py
      - name: Verify local rollback image manifest gate with synthetic images only
        run: python experimental/xmq-runtime-stage-a/tools/test_verify_rollback.py
      - name: Verify combined canary release gate is fail-closed before touching private images
        run: python experimental/xmq-runtime-stage-a/tools/test_canary_release_gate.py
      - name: Verify lab meter clone has only the guarded post-decode hook
        run: python experimental/xmq-runtime-stage-a/tools/check_shadow_lab_meter.py
      - name: Verify future isolated legacy setter instrumentation staging without patching active common
        run: python experimental/xmq-runtime-stage-a/tools/test_legacy_setter_staging.py
      - name: Execute verbatim instrumented legacy setter methods on synthetic fields
        shell: bash
        run: |
          set -euo pipefail
          python experimental/xmq-runtime-stage-a/tools/test_legacy_setter_execution.py
      - name: Execute exact legacy handleTelegram orchestration with synthetic parser and staged setters
        shell: bash
        run: |
          set -euo pipefail
          python experimental/xmq-runtime-stage-a/tools/test_legacy_handle_flow.py
      - name: Compile real instrumented legacy C++ object and verify setter symbols on host
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          python experimental/xmq-runtime-stage-a/tools/stage_legacy_setter_instrumentation.py --output "$scratch/meters.cc"
          g++ -std=c++17 -O0 -g0 -c -Wall -Wextra -Wno-unused-parameter \
            -Icomponents/wmbus_common \
            -Iexperimental/xmq-runtime-stage-a/host-stubs \
            -Iexperimental/xmq-runtime-stage-a \
            "$scratch/meters.cc" -o "$scratch/meters.o"
          test -s "$scratch/meters.o"
          # Independently compile the untouched production source with identical flags.
          # Fail if instrumentation removes any externally visible strong function.
          g++ -std=c++17 -O0 -g0 -c -Wall -Wextra -Wno-unused-parameter \
            -Icomponents/wmbus_common \
            -Iexperimental/xmq-runtime-stage-a/host-stubs \
            -Iexperimental/xmq-runtime-stage-a \
            components/wmbus_common/meters.cc -o "$scratch/meters-baseline.o"
          nm -P -g --defined-only "$scratch/meters-baseline.o" \
            | awk '$2 == "T" {print $1}' | LC_ALL=C sort -u > "$scratch/baseline-functions.txt"
          nm -P -g --defined-only "$scratch/meters.o" \
            | awk '$2 == "T" {print $1}' | LC_ALL=C sort -u > "$scratch/instrumented-functions.txt"
          test -s "$scratch/baseline-functions.txt"
          if ! comm -23 "$scratch/baseline-functions.txt" "$scratch/instrumented-functions.txt" \
              > "$scratch/missing-functions.txt"; then
            echo "::error::Cannot compare instrumented and baseline function symbols"
            exit 1
          fi
          if test -s "$scratch/missing-functions.txt"; then
            echo "::error::Instrumented legacy decoder lost exported strong functions"
            cat "$scratch/missing-functions.txt"
            exit 1
          fi
          echo "PASS: instrumented decoder preserves all baseline strong exported functions"
          # Inventory unresolved external dependencies before attempting a complete host link.
          # Keep output aggregate-only: no payloads, meter IDs, or values.
          nm -P -u "$scratch/meters-baseline.o" \
            | awk '$2 == "U" {print $1}' | LC_ALL=C sort -u > "$scratch/baseline-undefined.txt"
          nm -P -u "$scratch/meters.o" \
            | awk '$2 == "U" {print $1}' | LC_ALL=C sort -u > "$scratch/instrumented-undefined.txt"
          comm -13 "$scratch/baseline-undefined.txt" "$scratch/instrumented-undefined.txt" \
            > "$scratch/added-undefined.txt"
          echo "Legacy baseline unresolved externals: $(wc -l < "$scratch/baseline-undefined.txt")"
          echo "Instrumented unresolved externals: $(wc -l < "$scratch/instrumented-undefined.txt")"
          echo "Additional unresolved externals: $(wc -l < "$scratch/added-undefined.txt")"
          nm -C --defined-only "$scratch/meters.o" > "$scratch/symbols.txt"
          grep -Fq 'MeterCommonImplementation::setNumericValue(' "$scratch/symbols.txt"
          grep -Fq 'MeterCommonImplementation::setStringValue(' "$scratch/symbols.txt"
          grep -Fq 'MeterCommonImplementation::handleTelegram(' "$scratch/symbols.txt"
          grep -Fq 'xmq_runtime::LegacyWriteJournal::try_numeric_write(' "$scratch/symbols.txt"
          grep -Fq 'xmq_runtime::LegacyWriteJournal::try_string_write(' "$scratch/symbols.txt"
          # This is a relocatable link, not a complete executable link:
          # verify journal API survives object linking and inspect outstanding dependencies.
          cat > "$scratch/journal-probe.cpp" <<'CPP'
          #include "xmq_legacy_write_journal.h"
          extern "C" int xmq_stage_a_journal_probe() {
            xmq_runtime::LegacyWriteJournal journal;
            journal.begin_telegram();
            const bool recorded = journal.try_numeric_write("current_hca");
            journal.end_telegram();
            return recorded && journal.wrote_numeric("current_hca")
                       && journal.dropped_writes() == 0 ? 1 : 0;
          }
          CPP
          g++ -std=c++17 -O0 -g0 -c \
            -Iexperimental/xmq-runtime-stage-a \
            "$scratch/journal-probe.cpp" -o "$scratch/journal-probe.o"
          g++ -r "$scratch/meters.o" "$scratch/journal-probe.o" -o "$scratch/combined.o"
          test -s "$scratch/combined.o"
          nm -C --defined-only "$scratch/combined.o" > "$scratch/linked-symbols.txt"
          grep -Fq 'MeterCommonImplementation::handleTelegram(' "$scratch/linked-symbols.txt"
          grep -Fq 'MeterCommonImplementation::setNumericValue(' "$scratch/linked-symbols.txt"
          grep -Fq 'MeterCommonImplementation::setStringValue(' "$scratch/linked-symbols.txt"
          grep -Fq 'xmq_stage_a_journal_probe' "$scratch/linked-symbols.txt"
          grep -Fq 'xmq_stage_a_register_legacy_write_observer' "$scratch/linked-symbols.txt"
          grep -Fq 'xmq_runtime::summarize_legacy_writes(' "$scratch/linked-symbols.txt"
          nm -C --undefined-only "$scratch/combined.o" > "$scratch/unresolved.txt"
          if grep -E '^.*[[:space:]]U[[:space:]]+xmq_stage_a_' "$scratch/unresolved.txt"; then
            echo "::error::Unexpected unresolved XMQ Stage A hook"
            exit 1
          fi
          # Add ACTUAL legacy wM-Bus parser translation units to the host
          # relocatable link. This does not substitute parser mocks for production code.
          for parser in wmbus dvparser; do
            g++ -std=c++17 -O0 -g0 -c -Wall -Wextra -Wno-unused-parameter \
              -Icomponents/wmbus_common \
              -Iexperimental/xmq-runtime-stage-a/host-stubs \
              -Iexperimental/xmq-runtime-stage-a \
              "components/wmbus_common/${parser}.cc" -o "$scratch/${parser}.o"
            test -s "$scratch/${parser}.o"
          done
          nm -C --defined-only "$scratch/wmbus.o" > "$scratch/parser-symbols.txt"
          grep -Fq 'Telegram::parseHeader(' "$scratch/parser-symbols.txt"
          grep -Fq 'Telegram::parse(' "$scratch/parser-symbols.txt"
          g++ -r "$scratch/combined.o" "$scratch/wmbus.o" "$scratch/dvparser.o" \
            -o "$scratch/legacy-parser-linked.o"
          test -s "$scratch/legacy-parser-linked.o"
          nm -C --defined-only "$scratch/legacy-parser-linked.o" \
            > "$scratch/legacy-parser-linked-symbols.txt"
          grep -Fq 'MeterCommonImplementation::handleTelegram(' "$scratch/legacy-parser-linked-symbols.txt"
          grep -Fq 'Telegram::parseHeader(' "$scratch/legacy-parser-linked-symbols.txt"
          grep -Fq 'Telegram::parse(' "$scratch/legacy-parser-linked-symbols.txt"
          # Resolve more of the actual upstream legacy dependency graph, keeping
          # the original component files unmodified. This is an incremental
          # relocatable link and does not perform real OMS decode.
          for unit in util units wmbus_utils translatebits formula manufacturer_specificities; do
            g++ -std=c++17 -O0 -g0 -c -Wall -Wextra -Wno-unused-parameter \
              -Icomponents/wmbus_common \
              -Iexperimental/xmq-runtime-stage-a/host-stubs \
              -Iexperimental/xmq-runtime-stage-a \
              "components/wmbus_common/${unit}.cc" -o "$scratch/${unit}.o"
            test -s "$scratch/${unit}.o"
          done
          nm -P -u "$scratch/legacy-parser-linked.o" \
            | awk '$2 == "U" {print $1}' | LC_ALL=C sort -u > "$scratch/parser-undefined.txt"
          g++ -r "$scratch/legacy-parser-linked.o" \
            "$scratch/util.o" "$scratch/units.o" "$scratch/wmbus_utils.o" \
            "$scratch/translatebits.o" "$scratch/formula.o" \
            "$scratch/manufacturer_specificities.o" \
            -o "$scratch/legacy-core-linked.o"
          test -s "$scratch/legacy-core-linked.o"
          nm -P -u "$scratch/legacy-core-linked.o" \
            | awk '$2 == "U" {print $1}' | LC_ALL=C sort -u > "$scratch/core-undefined.txt"
          comm -23 "$scratch/parser-undefined.txt" "$scratch/core-undefined.txt" \
            > "$scratch/resolved-symbols.txt"
          printf 'Parser/meter unresolved symbol count: %s\n' \
            "$(wc -l < "$scratch/parser-undefined.txt")"
          printf 'Expanded legacy core unresolved symbol count: %s\n' \
            "$(wc -l < "$scratch/core-undefined.txt")"
          printf 'Resolved symbols by additional upstream units: %s\n' \
            "$(wc -l < "$scratch/resolved-symbols.txt")"
          test -s "$scratch/resolved-symbols.txt" || {
            echo "::error::No parser/meter references resolved by extra upstream legacy units"
            exit 1
          }
          nm -C --defined-only "$scratch/legacy-core-linked.o" \
            > "$scratch/core-linked-symbols.txt"
          grep -Fq 'MeterCommonImplementation::handleTelegram(' "$scratch/core-linked-symbols.txt"
          grep -Fq 'Telegram::parseHeader(' "$scratch/core-linked-symbols.txt"
          grep -Fq 'Telegram::parse(' "$scratch/core-linked-symbols.txt"
          echo "PASS: expanded REAL legacy core sources link with parser and instrumented meter as relocatable object; full executable and OMS decode not yet proven"
          echo "PASS: real parser wmbus.cc/dvparser.cc and staged legacy meters.cc link as one relocatable object"
          echo "NOTE: remaining legacy dependencies unresolved, not an executable and no real telegram decoded"
          echo "PASS: relocatable combined object retains legacy setters and journal contract; unresolved legacy library dependencies remain expected"
          echo "NOTE: -r does not prove full link or execute real meter decoding; NO FLASH"
      - name: Attempt strict real legacy Telegram parser HOST executable link
        shell: bash
        run: |
          set -euo pipefail
          python experimental/xmq-runtime-stage-a/tools/test_real_legacy_parser_host_link.py
      - name: Ensure 12-meter canary never contains private IDs or AES keys
        run: python experimental/xmq-runtime-stage-a/tools/check_canary_12.py
      - name: Ensure live components differ only by the audited hex compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin experimental/dual-radio-sx126x-sx127x-sync54
          git diff --exit-code FETCH_HEAD HEAD -- components/sx126x components/sx127x components/wmbus_common components/wmbus_meter
          git diff --exit-code FETCH_HEAD HEAD -- components/wmbus_radio/ ':!components/wmbus_radio/packet.cpp'
          python - <<'PY'
          from pathlib import Path
          import subprocess
          old = subprocess.check_output(
              ["git", "show", "FETCH_HEAD:components/wmbus_radio/packet.cpp"], text=True)
          new = Path("components/wmbus_radio/packet.cpp").read_text()
          old_line = "std::string Frame::as_hex() { return format_hex(this->data_); }"
          replacement = """std::string Frame::as_hex() {
            // ESPHome 2026.11 removed format_hex() from core helpers. Encode locally
            // to keep the same contiguous, lowercase, two-digits-per-byte representation
            // on ESPHome 2026.10 and newer releases without depending on core internals.
            static constexpr char HEX_DIGITS[] = "0123456789abcdef";
            std::string output;
            output.reserve(this->data_.size() * 2);
            for (uint8_t byte : this->data_) {
              output.push_back(HEX_DIGITS[byte >> 4]);
              output.push_back(HEX_DIGITS[byte & 0x0F]);
            }
            return output;
          }"""
          replacement = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in replacement.split("\n"))
          if old.count(old_line) != 1 or new != old.replace(old_line, replacement):
              raise SystemExit("BLOCKED: packet.cpp changed beyond approved hex compatibility patch")
          print("PASS: only approved packet.cpp hex compatibility change")
          PY

  esp32s3-xmq-build:
    name: ESP32-S3 XMQ isolated ESP-IDF build-only
    needs: xmq-stage-a-host
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Compile minimal XMQ ESP32-S3 firmware with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          path: experimental/xmq-runtime-stage-a/espidf-smoke
          command: idf.py build && idf.py size

  heltec-esphome-build:
    name: Heltec SX1262 legacy ESPHome build-only baseline
    needs: xmq-stage-a-host
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned ESPHome
        run: python -m pip install --disable-pip-version-check "esphome==2026.10.1"
      - name: Validate and compile existing Heltec SX1262 fixture, NO FLASH
        shell: bash
        run: |
          set -euo pipefail
          esphome config tests/sx126x-wmbus-bridge.yaml
          esphome compile tests/sx126x-wmbus-bridge.yaml
          echo "PASS: production-shaped Heltec fixture still compiles"

  heltec-esphome-2026-11-compat:
    name: Heltec SX1262 ESPHome 2026.11.0 radio compile compatibility
    needs: xmq-stage-a-host
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install ESPHome 2026.11.0 (user-reported failing version)
        run: python -m pip install --disable-pip-version-check "esphome==2026.11.0"
      - name: Compile SX1262 radio and wM-Bus components on ESPHome 2026.11.0 (NO FLASH)
        shell: bash
        run: |
          set -euo pipefail
          esphome config tests/sx126x-wmbus-bridge.yaml
          esphome compile tests/sx126x-wmbus-bridge.yaml
          echo "PASS: ESPHome 2026.11.0 SX1262 wmbus_radio packet.cpp compiles without format_hex"

  heltec-xmq-shadow-build:
    name: Heltec SX1262 ESPHome with XMQ linked, probe disabled
    needs: xmq-stage-a-host
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned ESPHome
        run: python -m pip install --disable-pip-version-check "esphome==2026.10.1"
      - name: Audit opt-in shadow interface and compile combined Heltec image, NO FLASH
        shell: bash
        run: |
          set -euo pipefail
          dir=experimental/xmq-runtime-stage-a
          python "$dir/tools/stage_shadow_headers.py"
          grep -q 'enabled: false' "$dir/heltec-xmq-shadow-build.yaml"
          ! grep -E '(add_frame_handler|add_meter_frame_handler|handleTelegram|mark_as_handled)' "$dir/components/xmq_shadow_probe/xmq_shadow_probe.cpp"
          esphome config "$dir/heltec-xmq-shadow-build.yaml"
          esphome compile "$dir/heltec-xmq-shadow-build.yaml"
          echo "PASS: actual ESPHome firmware links the XMQ engine with existing Heltec radio, probe disabled"
      - name: Validate and compile canary connectivity with temporary CI-only credentials
        shell: bash
        run: |
          set -euo pipefail
          dir=experimental/xmq-runtime-stage-a
          trap 'rm -f "$dir/secrets.yaml"' EXIT
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path("experimental/xmq-runtime-stage-a/secrets.yaml")
          assert not p.exists(), "CI must not overwrite existing credentials"
          dummy_key=base64.b64encode(bytes(range(32))).decode("ascii")
          p.write_text(
              "wifi_ssid: xmq-ci-only\n"
              "wifi_password: ci-placeholder-do-not-use\n"
              f"heltec_api_key: {dummy_key}\n"
              "heltec_ota_password: ci-placeholder-ota-only\n"
          )
          # Synthetic, NON-SECRET credentials for the twelve-meter CI fixture.
          meters = [
              "heat_baie", "heat_dormitor_1", "heat_sufragerie",
              "heat_bucatarie", "heat_dormitor_2", "heat_dormitor_3",
              "heat_wc_serviciu", "water_rece_baie", "water_rece_bucatarie",
              "water_calda_baie", "water_calda_bucatarie",
              "water_calda_wc_serviciu"
          ]
          with p.open("a") as out:
              for i, name in enumerate(meters, 1):
                  out.write(f"{name}_id: 0x{0x12340000 + i:08X}\n")
                  out.write(f"{name}_key: '0123456789ABCDEF0123456789ABCDEF'\n")
          PY
          grep -q 'enabled: false' "$dir/heltec-xmq-canary.yaml"
          ! grep -E '(^|[[:space:]])(ssid|password|key): [^!]' "$dir/heltec-xmq-canary.yaml"
          esphome config "$dir/heltec-xmq-canary.yaml"
          esphome compile "$dir/heltec-xmq-canary.yaml"
          echo "PASS: canary has Wi-Fi, encrypted API and OTA with local-secret references only; XMQ disabled"
          esphome config "$dir/heltec-xmq-canary-12-meters.yaml"
          esphome compile "$dir/heltec-xmq-canary-12-meters.yaml"
          echo "PASS: twelve-meter canary compiles with 7 HCA and 5 water meters, dummy CI-only credentials; XMQ disabled"
      - name: Compile GitHub-sourced Heltec XMQ component without local staging
        shell: bash
        run: |
          set -euo pipefail
          esphome config experimental/xmq-runtime-stage-a/heltec-xmq-github-install-smoke.yaml
          esphome compile experimental/xmq-runtime-stage-a/heltec-xmq-github-install-smoke.yaml
          echo "PASS: direct GitHub external_components, no local staged headers required"
 || true)
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected changes in live components:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          # Permit exactly the audited ESPHome 2026.11 format_hex migration,
          # not arbitrary changes to radio/decoder logic.
          python - <<'PY'
          from pathlib import Path
          import subprocess
          old = subprocess.check_output(
              ["git", "show", "FETCH_HEAD:components/wmbus_radio/packet.cpp"],
              text=True,
          )
          new = Path("components/wmbus_radio/packet.cpp").read_text()
          old_line = "std::string Frame::as_hex() { return format_hex(this->data_); }"
          replacement = """std::string Frame::as_hex() {
  // ESPHome 2026.11 removed format_hex() from core helpers. Encode locally
  // to keep the same contiguous, lowercase, two-digits-per-byte representation
  // on ESPHome 2026.10 and newer releases without depending on core internals.
  static constexpr char HEX_DIGITS[] = "0123456789abcdef";
  std::string output;
  output.reserve(this->data_.size() * 2);
  for (uint8_t byte : this->data_) {
    output.push_back(HEX_DIGITS[byte >> 4]);
    output.push_back(HEX_DIGITS[byte & 0x0F]);
  }
  return output;
}"""
          if old.count(old_line) != 1 or new != old.replace(old_line, replacement):
              raise SystemExit("BLOCKED: wmbus_radio/packet.cpp differs beyond exact format_hex fix")
          print("PASS: live packet.cpp contains exactly audited ESPHome hex compatibility fix")
          PY
          echo "PASS: all other live radio and meter components unchanged"

