name: XMQ Stage A isolated host tests
on:
  push:
    branches:
      - experimental/xmq-runtime-stage-a
    paths:
      - experimental/xmq-runtime-stage-a/run-once-20261116.txt
permissions:
  contents: read
concurrency:
  group: xmq-stage-a-single-validation
  cancel-in-progress: false
jobs:
  xmq-stage-a-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Verify GitHub-bundled XMQ shadow API matches core source BEFORE staging
        shell: bash
        run: |
          set -euo pipefail
          dir=experimental/xmq-runtime-stage-a
          cmp "$dir/xmq_shadow_diagnostic.h" "$dir/components/xmq_shadow_probe/xmq_shadow_diagnostic.h"
          echo "PASS: GitHub-installable shadow API matches host source"
      - name: Compile and run isolated XMQ tests
        shell: bash
        run: |
          set -euo pipefail
          dir=experimental/xmq-runtime-stage-a
          python "$dir/tools/stage_shadow_headers.py"
          failures=0
          for suite in reader semantic expression dv_subset projection ixml_subset numeric_runtime hca_numeric calendar oms_partial clear_runtime driver_registry driver_loader source_registry mounted_vfs frame_bridge shadow_compare shadow_diagnostic legacy_write_journal telegram_capture real_telegram_contract compat_macros staged_reader; do
            echo "::group::XMQ suite: $suite"
            if g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic \
              -fsanitize=address,undefined -fno-omit-frame-pointer \
              -I"$dir" -I"$dir/host-stubs" "$dir/test_xmq_${suite}.cpp" \
              -o "$RUNNER_TEMP/xmq-${suite}"; then
              if "$RUNNER_TEMP/xmq-${suite}"; then
                echo "PASS $suite"
              else
                echo "::error title=XMQ test failure::$suite failed"
                failures=$((failures+1))
              fi
            else
              echo "::error title=XMQ compile failure::$suite failed compilation"
              failures=$((failures+1))
            fi
            echo "::endgroup::"
          done
          echo "XMQ suite failures: $failures"
          exit "$((failures>0))"
      - name: Check confidential local canary preflight regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
          python experimental/xmq-runtime-stage-a/tools/test_preflight_canary.py
      - name: Verify local rollback image manifest gate with synthetic images only
        run: python experimental/xmq-runtime-stage-a/tools/test_verify_rollback.py
      - name: Verify lab meter clone has only the guarded post-decode hook
        run: python experimental/xmq-runtime-stage-a/tools/check_shadow_lab_meter.py
      - name: Verify future isolated legacy setter instrumentation staging without patching active common
        run: python experimental/xmq-runtime-stage-a/tools/test_legacy_setter_staging.py
      - name: Syntax compile actual lab-instrumented legacy common decoder on host
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          python experimental/xmq-runtime-stage-a/tools/stage_legacy_setter_instrumentation.py --output "$scratch/meters.cc"
          g++ -std=c++17 -fsyntax-only -Wall -Wextra -Wno-unused-parameter \
            -Icomponents/wmbus_common \
            -Iexperimental/xmq-runtime-stage-a/host-stubs \
            -Iexperimental/xmq-runtime-stage-a \
            "$scratch/meters.cc"
          echo "PASS: real legacy meters.cc syntax-checks with isolated per-telegram write journal"
      - name: Ensure 12-meter canary never contains private IDs or AES keys
        run: python experimental/xmq-runtime-stage-a/tools/check_canary_12.py
      - name: Ensure radio implementation stays unchanged from baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin experimental/dual-radio-sx126x-sx127x-sync54
          changes=$(git diff --name-only FETCH_HEAD HEAD -- components/sx126x components/sx127x components/wmbus_radio components/wmbus_common components/wmbus_meter)
          if [[ -n "$changes" ]]; then
            echo "Unexpected changes in live components:"
            printf '%s\n' "$changes"
            exit 1
          fi
          echo "PASS: live radio and meter components unchanged"

  esp32s3-xmq-build:
    name: ESP32-S3 XMQ isolated ESP-IDF build-only
    needs: xmq-stage-a-host
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Compile minimal XMQ ESP32-S3 firmware with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          path: experimental/xmq-runtime-stage-a/espidf-smoke
          command: idf.py build && idf.py size

  heltec-esphome-build:
    name: Heltec SX1262 legacy ESPHome build-only baseline
    needs: xmq-stage-a-host
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned ESPHome
        run: python -m pip install --disable-pip-version-check "esphome==2026.10.1"
      - name: Validate and compile existing Heltec SX1262 fixture, NO FLASH
        shell: bash
        run: |
          set -euo pipefail
          esphome config tests/sx126x-wmbus-bridge.yaml
          esphome compile tests/sx126x-wmbus-bridge.yaml
          echo "PASS: production-shaped Heltec fixture still compiles"

  heltec-xmq-shadow-build:
    name: Heltec SX1262 ESPHome with XMQ linked, probe disabled
    needs: xmq-stage-a-host
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned ESPHome
        run: python -m pip install --disable-pip-version-check "esphome==2026.10.1"
      - name: Audit opt-in shadow interface and compile combined Heltec image, NO FLASH
        shell: bash
        run: |
          set -euo pipefail
          dir=experimental/xmq-runtime-stage-a
          python "$dir/tools/stage_shadow_headers.py"
          grep -q 'enabled: false' "$dir/heltec-xmq-shadow-build.yaml"
          ! grep -E '(add_frame_handler|add_meter_frame_handler|handleTelegram|mark_as_handled)' "$dir/components/xmq_shadow_probe/xmq_shadow_probe.cpp"
          esphome config "$dir/heltec-xmq-shadow-build.yaml"
          esphome compile "$dir/heltec-xmq-shadow-build.yaml"
          echo "PASS: actual ESPHome firmware links the XMQ engine with existing Heltec radio, probe disabled"
      - name: Validate and compile canary connectivity with temporary CI-only credentials
        shell: bash
        run: |
          set -euo pipefail
          dir=experimental/xmq-runtime-stage-a
          trap 'rm -f "$dir/secrets.yaml"' EXIT
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path("experimental/xmq-runtime-stage-a/secrets.yaml")
          assert not p.exists(), "CI must not overwrite existing credentials"
          dummy_key=base64.b64encode(bytes(range(32))).decode("ascii")
          p.write_text(
              "wifi_ssid: xmq-ci-only\n"
              "wifi_password: ci-placeholder-do-not-use\n"
              f"heltec_api_key: {dummy_key}\n"
              "heltec_ota_password: ci-placeholder-ota-only\n"
          )
          # Synthetic, NON-SECRET credentials for the twelve-meter CI fixture.
          meters = [
              "heat_baie", "heat_dormitor_1", "heat_sufragerie",
              "heat_bucatarie", "heat_dormitor_2", "heat_dormitor_3",
              "heat_wc_serviciu", "water_rece_baie", "water_rece_bucatarie",
              "water_calda_baie", "water_calda_bucatarie",
              "water_calda_wc_serviciu"
          ]
          with p.open("a") as out:
              for i, name in enumerate(meters, 1):
                  out.write(f"{name}_id: 0x{0x12340000 + i:08X}\n")
                  out.write(f"{name}_key: '0123456789ABCDEF0123456789ABCDEF'\n")
          PY
          grep -q 'enabled: false' "$dir/heltec-xmq-canary.yaml"
          ! grep -E '(^|[[:space:]])(ssid|password|key): [^!]' "$dir/heltec-xmq-canary.yaml"
          esphome config "$dir/heltec-xmq-canary.yaml"
          esphome compile "$dir/heltec-xmq-canary.yaml"
          echo "PASS: canary has Wi-Fi, encrypted API and OTA with local-secret references only; XMQ disabled"
          esphome config "$dir/heltec-xmq-canary-12-meters.yaml"
          esphome compile "$dir/heltec-xmq-canary-12-meters.yaml"
          echo "PASS: twelve-meter canary compiles with 7 HCA and 5 water meters, dummy CI-only credentials; XMQ disabled"
      - name: Compile GitHub-sourced Heltec XMQ component without local staging
        shell: bash
        run: |
          set -euo pipefail
          esphome config experimental/xmq-runtime-stage-a/heltec-xmq-github-install-smoke.yaml
          esphome compile experimental/xmq-runtime-stage-a/heltec-xmq-github-install-smoke.yaml
          echo "PASS: direct GitHub external_components, no local staged headers required"
