name: XMQ feasibility (experimental only)

on:
  push:
    branches: ["experimental/wmbusmeters-xmq"]
    paths:
      - "experimental/xmq/**"
      - ".github/workflows/xmq-feasibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  embedded-drivers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check generated XMQ header reproducibility
        run: python3 experimental/xmq/tools/embed_drivers.py --check
      - name: Compile and run embedding smoke test
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic -Werror \
            experimental/xmq/tests/embedding_smoke.cpp -o /tmp/xmq_embed_smoke
          /tmp/xmq_embed_smoke

  libxmq-host-probe:
    runs-on: ubuntu-latest
    # This is explicitly an experimental probe, not a release gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Compile upstream libxmq C source and list unresolved symbols
        run: bash experimental/xmq/tools/probe_libxmq_host.sh

  upstream-decoding-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Reference decoder test, separate from the experimental embedded implementation.
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev librtlsdr-dev libusb-1.0-0-dev pkg-config
      - name: Checkout pinned upstream wmbusmeters
        run: |
          git clone https://github.com/wmbusmeters/wmbusmeters.git /tmp/wmbusmeters-upstream
          cd /tmp/wmbusmeters-upstream
          git checkout 293fd38cdcca176091c789c33a8797d67471c060
      - name: Compile full upstream reference decoder
        run: |
          cd /tmp/wmbusmeters-upstream
          ./configure
          make -j2
      - name: Decode and verify four official Techem fixtures
        run: |
          python3 experimental/xmq/tests/decode_upstream.py \
            --binary /tmp/wmbusmeters-upstream/build/wmbusmeters

  espidf-s3-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install ESP-IDF 5.5.6
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32s3
          path: experimental/xmq/espidf_probe
          command: |
            bash "../tools/probe_libxmq_espidf.sh"

  xmq-portability-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Fetch pinned source files and inventory portability
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve
          sha = "293fd38cdcca176091c789c33a8797d67471c060"
          folder = Path("/tmp/wmbus-xmq-source")
          folder.mkdir(parents=True, exist_ok=True)
          for filename in ("xmq.c", "xmq.h", "driver_dynamic.cc", "drivers.cc"):
              urlretrieve(f"https://raw.githubusercontent.com/wmbusmeters/wmbusmeters/{sha}/src/{filename}", folder / filename)
          PY
          python3 experimental/xmq/tools/inventory_dependencies.py \
            --src /tmp/wmbus-xmq-source --out /tmp/xmq-portability.json
      - uses: actions/upload-artifact@v4
        with:
          name: xmq-portability-inventory
          path: /tmp/xmq-portability.json
          retention-days: 14

  portable-xmq-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Syntax check and structural parser regression tests
        run: |
          python3 -m py_compile experimental/xmq/tools/portable_xmq.py
          python3 -m unittest discover -s experimental/xmq/tests -p 'test_portable_xmq.py' -v
      - name: Export parsed structure for review
        run: |
          python3 experimental/xmq/tools/portable_xmq.py \
            experimental/xmq/drivers/fhkvdataiii.xmq \
            experimental/xmq/drivers/mkradio4.xmq \
            --out /tmp/xmq-structural-tree.json
      - uses: actions/upload-artifact@v4
        with:
          name: xmq-structural-tree
          path: /tmp/xmq-structural-tree.json
          retention-days: 14
