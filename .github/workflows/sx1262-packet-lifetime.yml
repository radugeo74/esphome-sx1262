name: SX1262 packet lifetime checks
on:
  push:
    branches:
      - test/sx1262-packet-lifetime
  workflow_dispatch:
jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Packet lifetime and ISR contracts
        run: python3 -m unittest discover -s tests -p 'test_sx1262_packet_lifetime.py' -v
      - name: Compile and run ownership scenarios with sanitizers
        run: |
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            tests/test_packet_queue_ownership.cpp -o /tmp/packet-ownership-test
          /tmp/packet-ownership-test

  espidf-s3-component-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned ESPHome toolchain
        run: python -m pip install esphome==2026.4.1
      - name: Compile actual local radio component for ESP32-S3 (no flash)
        run: esphome compile tests/sx1262_lifetime_ci.yaml
