name: XMQ standalone isolated engine
on:
  push:
    branches:
      - experimental/xmq-standalone-no-legacy
    paths:
      - 'experimental/xmq-standalone/**'
      - 'components/wmbus_radio/**'
      - '.github/workflows/xmq-standalone.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xmq-standalone-one-check
  cancel-in-progress: false
jobs:
  pure-xmq-12-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Compile and execute pure XMQ logical meter contracts
        shell: bash
        run: |
          set -euo pipefail
          dir=experimental/xmq-standalone
          g++ -std=c++17 -O1 -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Iexperimental/xmq-runtime-stage-a \
            -Iexperimental/xmq-runtime-stage-a/components/xmq_shadow_probe \
            "$dir/test_standalone_engine.cpp" -o /tmp/xmq-standalone-engine
          /tmp/xmq-standalone-engine
      - name: Compile complete Heltec SX1262 XMQ-primary firmware with 12 synthetic meters
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "esphome==2026.11.0"
          esphome compile experimental/xmq-standalone/heltec-xmq-12-build.yaml
      - name: Guard compile-time XMQ-only route against stale config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path("components/wmbus_radio/component.cpp").read_text()
          section = text.split("#ifdef XMQ_STANDALONE_ONLY", 1)[1].split("#else", 1)[0]
          assert "for (auto &handler : this->handlers_)" in section
          assert "direct_xmq_only_" not in section, "XMQ-only dispatch must not be gated by stale YAML"
          assert "Telegram header" not in section
          print("XMQ_COMPILE_TIME_EXCLUSIVE_ROUTE_OK")
          PY
      - name: Assert independent processor excludes legacy decoder and HA writes
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'handleTelegram\\(|Telegram::parse|wmbus_common/|publish_state\\(' \
              experimental/xmq-standalone/standalone_engine.h
