name: XMQ standalone isolated engine
on:
  push:
    branches:
      - experimental/xmq-standalone-no-legacy
    paths:
      - 'experimental/xmq-standalone/**'
      - 'components/wmbus_radio/**'
      - '.github/workflows/xmq-standalone.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xmq-standalone-one-check
  cancel-in-progress: false
jobs:
  pure-xmq-12-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Compile and execute pure XMQ logical meter contracts
        shell: bash
        run: |
          set -euo pipefail
          dir=experimental/xmq-standalone
          g++ -std=c++17 -O1 -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Iexperimental/xmq-runtime-stage-a \
            -Iexperimental/xmq-runtime-stage-a/components/xmq_shadow_probe \
            "$dir/test_standalone_engine.cpp" -o /tmp/xmq-standalone-engine
          /tmp/xmq-standalone-engine
      - name: Validate independent EN13757 PHY CRC on captured T1 and generated B frames
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            experimental/xmq-standalone/test_phy_crc.cpp -o /tmp/xmq-phy-crc
          /tmp/xmq-phy-crc
      - name: Compile complete Heltec SX1262 XMQ-primary firmware with 12 synthetic meters
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "esphome==2026.11.0"
          esphome compile experimental/xmq-standalone/heltec-xmq-12-build.yaml
      - name: Verify no legacy dispatch and preserve SX127x backend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          cpp = Path("components/wmbus_radio/component.cpp").read_text()
          h = Path("components/wmbus_radio/component.h").read_text()
          section = cpp.split("void Radio::dispatch_frame_(Frame &frame)",1)[1].split("void Radio::sx127x_stream_callback_",1)[0]
          assert "for (auto &handler : this->handlers_)" in section
          assert "Telegram" not in section.replace("Telegram::parseHeader", "bad") or "Telegram::parseHeader" not in section
          assert "meter_handlers_" not in section
          assert "trimCRCsFrameFormatA(" not in cpp
          assert "trimCRCsFrameFormatB(" not in cpp
          assert "checkWMBusFrame(" not in cpp
          assert "phy::strip_format_a(telegram)" in cpp
          assert "phy::strip_format_b(telegram)" in cpp
          assert "direct_xmq_only_" not in section
          assert "https://wmbusmeters.org/analyze/%s" in section
          assert "frame.as_hex()" in section
          assert "frame.handlers_count()" in section
          assert "this->analyzer_links_" in section
          assert "if (!handled && this->frame_logging_)" in section
          assert "if (this->frame_logging_) ESP_LOGD(TAG, \"T1 3-of-6 symbol rejected\")" in cpp
          assert "if (this->frame_logging_)" in cpp
          assert "cv.Optional(CONF_FRAME_LOGGING, default=False): cv.boolean" in Path("components/wmbus_radio/__init__.py").read_text()
          assert '#if __has_include("esphome/components/sx127x/sx127x.h")' in h
          assert "#ifdef WMBUS_RADIO_HAS_SX127X" in cpp
          assert "void Radio::on_packet(" in cpp
          print("XMQ_ONLY_LEGACY_DISPATCH_REMOVED")
          PY
      - name: Assert independent processor excludes legacy decoder and HA writes
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E 'handleTelegram\\(|Telegram::parse|wmbus_common/|publish_state\\(' \
              experimental/xmq-standalone/standalone_engine.h
