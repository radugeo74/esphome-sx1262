name: Native ESP-IDF SX126x baseline smoke
on:
  push:
    branches:
      - experimental/xmq-runtime-engine
      - experimental/dual-radio-sx126x-sx127x
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-radio-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
      - name: Python toolchain
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check patch presence and Python syntax
        run: |
          python -m compileall -q components/sx126x components/sx127x components/wmbus_radio
          python - <<'PY'
          from pathlib import Path
          root = Path("components/sx126x")
          source = (root / "sx126x.cpp").read_text()
          header = (root / "sx126x.h").read_text()
          assert "if (!this->wait_busy_()) return" in source
          assert "bool SX126x::wait_busy_()" in source
          assert "bool wait_busy_();" in header
          assert "char version_[16]{};" in header
          assert (root / "packet_transport" / "sx126x_transport.cpp").is_file()
          print("PASS: imported SX126x source guards and transport present")
          PY
      - name: Test T1 3-of-6 decoder under ASan and UBSan
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wmbus_stubs/esphome/core"
          printf '#pragma once\n' > "$RUNNER_TEMP/wmbus_stubs/esphome/core/helpers.h"
          printf '#pragma once\n' > "$RUNNER_TEMP/wmbus_stubs/esphome/core/log.h"
          g++ -std=c++17 -O1 -g -Wall -Wextra -Wno-unused-variable \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I. -I"$RUNNER_TEMP/wmbus_stubs" \
            components/wmbus_radio/decode3of6.cpp \
            tests/test_decode3of6_bridge.cpp -o "$RUNNER_TEMP/wmbus-3of6"
          "$RUNNER_TEMP/wmbus-3of6"
      - name: Test C1 Format A and two-block Format B under ASan and UBSan
        run: python tests/test_c1_crc_safety.py
      - name: Unit-test SX127x T1 physical length gate
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. tests/test_sx127x_t1_length.cpp -o "$RUNNER_TEMP/sx127x-t1-length"
          "$RUNNER_TEMP/sx127x-t1-length"
      - name: Install pinned ESPHome for native ESP-IDF smoke
        run: |
          python -m pip install --disable-pip-version-check "esphome==2026.10.1"
      - name: Validate isolated native SX126x YAML
        run: esphome config tests/sx126x-native-espidf.yaml
      - name: Compile SX126x native ESP-IDF Heltec fixture (build-only)
        run: esphome compile tests/sx126x-native-espidf.yaml
      - name: Validate new bridge schema with legacy mkradio4 meter
        run: esphome config tests/sx126x-wmbus-bridge.yaml
      - name: Validate SX127x selectable backend (experimental build-only)
        run: esphome config tests/sx127x-wmbus-lab.yaml
      - name: Reject SX127x C1 and missing DIO1 (negative schema)
        run: |
          sed 's/native_stream_mode: T1/native_stream_mode: T1_C1/' tests/sx127x-wmbus-lab.yaml > tests/sx127x-invalid-mode-ci.yaml
          if esphome config tests/sx127x-invalid-mode-ci.yaml; then
            echo "FAIL: SX127x C1 was incorrectly accepted"
            exit 1
          fi
          sed '/dio1_pin:/d' tests/sx127x-wmbus-lab.yaml > tests/sx127x-missing-dio1-ci.yaml
          if esphome config tests/sx127x-missing-dio1-ci.yaml; then
            echo "FAIL: SX127x streaming without DIO1 was incorrectly accepted"
            exit 1
          fi
          echo "PASS: SX127x rejects unsupported modes and missing FIFO interrupt"
      - name: Compile SX127x experimental backend (build-only)
        run: esphome compile tests/sx127x-wmbus-lab.yaml
      - name: Reject removed legacy SX1262 radio schema
        run: |
          if esphome config tests/sx1262-legacy-rollback.yaml; then
            echo "FAIL: legacy radio schema unexpectedly accepted"
            exit 1
          fi
          echo "PASS: legacy radio schema is rejected"
      - name: Validate combined C1 A/B native stream schema (build-only)
        run: |
          sed 's/native_stream_mode: T1/native_stream_mode: T1_C1/' tests/sx126x-wmbus-bridge.yaml > tests/sx126x-wmbus-c1-ci.yaml
          esphome config tests/sx126x-wmbus-c1-ci.yaml
      - name: Validate opt-in combined stream PHY diagnostics schema
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          p = Path("tests/sx126x-wmbus-bridge.yaml")
          obj = yaml.safe_load(p.read_text())
          obj["wmbus_radio"]["native_stream_mode"] = "T1_C1"
          obj["wmbus_radio"]["native_phy_diagnostics"] = True
          dest = Path("tests/sx126x-wmbus-c1-diag-ci.yaml")
          dest.write_text(yaml.safe_dump(obj, sort_keys=False))
          PY
          esphome config tests/sx126x-wmbus-c1-diag-ci.yaml
      - name: Compile native-only SX126x through original wmbus_meter (build-only)
        run: esphome compile tests/sx126x-wmbus-bridge.yaml
      - name: Generate privacy-safe full 12-meter migrated fixture
        run: python tests/build_full_meter_fixture.py
      - name: Validate 12-meter YAML, preserved sensor types and LED callback
        run: esphome config tests/sx126x-wmbus-12-meters-ci.yaml
      - name: Compile full 12-meter ESP-IDF SX126x bridge (build-only)
        run: esphome compile tests/sx126x-wmbus-12-meters-ci.yaml
