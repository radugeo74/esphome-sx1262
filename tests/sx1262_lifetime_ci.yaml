# Compile-only canary for SX1262 packet-lifetime changes.
# No credentials, OTA or devices are involved.
esphome:
  name: sx1262-lifetime-ci

esp32:
  board: heltec_wifi_lora_32_V3
  flash_size: 8MB
  framework:
    type: esp-idf

logger:
  level: INFO

external_components:
  - source:
      type: local
      path: ../components
    components:
      - wmbus_radio
      - wmbus_common

spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10
  miso_pin: GPIO11

wmbus_radio:
  radio_type: SX1262
  cs_pin: GPIO8
  reset_pin: GPIO12
  irq_pin: GPIO14
