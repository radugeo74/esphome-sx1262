# Synthetic build fixture; not the user's Home Assistant configuration.
esphome:
  name: sx1262-native-test
esp32:
  board: heltec_wifi_lora_32_V3
  flash_size: 8MB
  framework:
    type: esp-idf
    version: 5.5.6
external_components:
  - source:
      type: local
      path: ../components
logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: native-build-test
  password: test-only-password
time:
  - platform: sntp
    id: time_sntp
spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10
  miso_pin: GPIO11
wmbus_radio:
  radio_type: SX1262
  cs_pin: GPIO8
  reset_pin: GPIO12
  irq_pin: GPIO14
  on_frame:
    - then:
        - socket_transmitter.send:
            id: test_socket
            data: !lambda return frame->as_hex();
        - wmbus_radio.send_frame_with_socket:
            id: test_socket
            format: hex
        - wmbus_radio.send_frame_with_socket:
            id: test_socket
            format: raw
        - wmbus_radio.send_frame_with_socket:
            id: test_socket
            format: rtlwmbus
socket_transmitter:
  id: test_socket
  ip_address: 192.0.2.1
  port: 9022
  protocol: UDP
wmbus_meter:
  - id: test_meter_1
    meter_id: 0x10000001
    type: fhkvdataiii
    mode: [T1]
